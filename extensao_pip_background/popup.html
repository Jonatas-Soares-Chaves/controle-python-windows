<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Escurecimento da guia</title>
<style>
body { width: 280px; margin: 0; padding: 18px; font: 14px system-ui; color: #202124; background: #fff; }
h1 { font-size: 17px; margin: 0 0 18px; }
label { display: flex; justify-content: space-between; }
input { width: 100%; margin: 18px 0; accent-color: #167b58; }
button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
#status { margin-top: 12px; color: #a12323; }
</style>
<h1>Escurecimento da guia</h1>
<label for="dim">Intensidade <output id="value">0%</output></label>
<input id="dim" type="range" min="0" max="95" step="1" value="0" disabled>
<button id="reset" type="button" disabled>Restaurar brilho</button>
<div id="status" role="status"></div>
<script src="popup.js"></script>
</html>
